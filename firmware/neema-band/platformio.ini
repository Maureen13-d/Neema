; Neema band firmware — ESP32 + MAX30102 + DS18B20
; Build: pio run  |  Upload: pio run -t upload

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
  h2zero/NimBLE-Arduino@^1.4.3
  sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library@^1.1.2
  paulstoffregen/OneWire@^2.3.8
  milesgardner/DallasTemperature@^3.11.0
build_flags =
  -DCORE_DEBUG_LEVEL=0
